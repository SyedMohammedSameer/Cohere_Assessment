[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohere-chat-app"
version = "0.1.0"
description = "A Python app exposing API endpoints around the Cohere Chat API with a Wikipedia tool and query history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "cohere>=5.13",
    "tenacity>=8.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Silence known third-party deprecation noise so our own warnings stand out.
filterwarnings = [
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A sensible default set: pyflakes (F), pycodestyle (E, W), isort (I),
# pep8-naming (N), pyupgrade (UP), bugbear (B), and docstring presence (D).
select = ["E", "W", "F", "I", "N", "UP", "B", "D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not require module or function docstrings.
"tests/*" = ["D"]
